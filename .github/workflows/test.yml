name: Notebook checks

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notebook-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  notebook-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MPLBACKEND: Agg

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: notebooks/toy_data/requirements-notes.txt

      - name: Install notebook test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r notebooks/toy_data/requirements-notes.txt

      - name: Run notebook unit and publication checks
        run: |
          python -m pytest -q \
            notebooks/toy_data/tests/test_toy_notes.py \
            notebooks/toy_data/tests/test_notebook_pedagogy.py \
            notebooks/toy_data/tests/test_edm_cifar10_bridge.py

      - name: Check the frozen MNIST speedrun
        run: |
          python speedrun/test_speedrun.py
          python speedrun/benchmark.py --device cpu --n 100 --steps 2 --repeats 1 --out speedrun/results/local/ci-smoke.json
